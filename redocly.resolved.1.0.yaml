  /individuals/partner-income/{nino}/{taxYear}/partnership/{partnershipUtr}:
    get:
      security:
        - User-Restricted:
            - read:self-assessment
      summary: Retrieve Partner Income [test only]
      description: |
        This endpoint enables you to retrieve partner income.
        A National Insurance number, tax year and partnership UTR must be provided.

        ### Test data
        Scenario simulation using Gov-Test-Scenario headers is only available in the sandbox environment.

        | Header Value (Gov-Test-Scenario) | Scenario                                       |
        | -------------------------------- | ---------------------------------------------- |
        | N/A - DEFAULT                    | Simulates success response.                    |
        | NOT_FOUND                        | Simulates the scenario where no data is found. |
        | STATEFUL                         | Performs a stateful retrieve.                  |
      parameters:
        - name: nino
          in: path
          description: |
            National Insurance number, in the format `AA999999A`
          schema: *ref_6
          required: true
        - name: taxYear
          in: path
          description: |
            The tax year to which the data applies. The start year and end year must not span two tax years.
            The minimum tax year is 2026-27. No gaps are allowed, for example, 2026-28 is not valid.
          schema: *ref_7
          required: true
        - name: partnershipUtr
          in: path
          description: |
            A Unique Taxpayer Reference (UTR) for the partnership. If you are a partner in a foreign partnership, you will not
            have a partnership reference, so submit your personal UTR.<p>Must conform to the regular expression `^[0-9]{10}$`
          schema: &ref_19
            type: string
            pattern: ^[0-9]{10}$
            example: 4564564564
          required: true
        - name: Accept
          in: header
          description: |
            Specifies the response format and the version of the API to be used.
          schema: *ref_8
          required: true
        - name: Authorization
          in: header
          description: |
            An OAuth 2.0 Bearer Token with the *read:self-assessment* scope.
          schema: *ref_16
          required: true
        - name: Gov-Test-Scenario
          in: header
          description: |
            Only in sandbox environment. See Test Data table for all header values.
          schema: *ref_9
          required: false
      responses:
        '200':
          description: Success
          headers:
            X-CorrelationId:
              in: header
              type: string
              description: |
                Unique ID for operation tracking
                String, 36 characters.
              schema: *ref_0
              required: true
            Deprecation:
              name: Deprecation
              in: header
              description: |
                The deprecation date/time for this endpoint.
              schema: *ref_1
              required: false
            Sunset:
              name: Sunset
              in: header
              description: |
                The earliest date/time this endpoint will become unavailable after deprecation.
              schema: *ref_2
              required: false
            Link:
              name: Link
              in: header
              description: |
                URL of the documentation for the API.
              schema: *ref_3
              required: false
          content:
            application/json:
              schema:
                $schema: http://json-schema.org/draft-04/schema#
                type: object
                properties:
                  submittedOn:
                    type: string
                    description: The date and time of the partner income submission, in the format `YYYY-MM-DDThh:mm:ss.SSSZ`
                    format: date-time
                    example: '2026-08-24T14:15:22.544Z'
                  partnershipUtr:
                    description: A Unique Taxpayer Reference (UTR) for the partnership. If you are a partner in a foreign partnership, you will not have a partnership reference, so submit your personal UTR.
                    type: string
                    example: '4564564564'
                    pattern: ^[0-9]{10}$
                  partnershipName:
                    description: The name of the partnership.
                    type: string
                    example: ABC Partnership
                    pattern: ^.{1,105}$
                  startDate:
                    description: |-
                      The date the individual joined the partnership during the tax year.

                      Must conform to the format `YYYY-MM-DD`
                    type: string
                    format: date
                    example: '2026-06-24'
                  endDate:
                    description: |-
                      The date the individual left the partnership during the tax year.

                      Must conform to the format `YYYY-MM-DD`
                    type: string
                    format: date
                    example: '2026-07-24'
                  cashBasis:
                    description: Indicates whether the partnership used cash basis (money actually received and paid out) to calculate its trading and professional income and expenses.
                    type: boolean
                    example: true
                  partnershipTrades:
                    description: An array containing details of the partnership's trades.
                    type: array
                    minItems: 1
                    items:
                      type: object
