components:
  examples:

    # 400

    formatNino:
      description: The format of the supplied NINO field is not valid.
      value:
        code: FORMAT_NINO
        message: The provided NINO is invalid

    formatTaxYear:
      description: The format of the supplied tax year field is not valid.
      value:
        code: FORMAT_TAX_YEAR
        message: The provided tax year is invalid
    
    formatValue:
      description: One or more values have been added with the incorrect format.
      value:
        code: FORMAT_VALUE
        message: The value must be between 0 and 99999999999.99

    formatPartnershipUtr:
      description: The format of the supplied partnership UTR field is not valid.
      value:
        code: FORMAT_PARTNERSHIP_UTR
        message: The provided partnership UTR is invalid

    formatPartnershipName:
      description: The format of the supplied partnership name field is not valid.
      value:
        code: FORMAT_PARTNERSHIP_NAME
        message: The provided partnership name is invalid
    
    formatStartDate:
      description: The format of the supplied start date field is not valid.
      value:
        code: FORMAT_START_DATE
        message: The provided start date is invalid

    formatEndDate:
      description: The format of the supplied end date field is not valid.
      value:
        code: FORMAT_END_DATE
        message: The provided end date is invalid

    formatTradeDescription:
      description: The format of the supplied trade description field is not valid.
      value:
        code: FORMAT_TRADE_DESCRIPTION
        message: The provided trade description is invalid

    ruleStartDate:
      description: The start date must fall within the tax year provided.
      value:
        code: RULE_START_DATE
        message: The start date does not fall within the tax year provided

    ruleEndDate:
      description: The end date must fall within the tax year provided.
      value:
        code: RULE_END_DATE
        message: The end date does not fall within the tax year provided

    ruleEndDateBeforeStartDate:
      description: The end date is before the start date.
      value:
        code: RULE_END_DATE_BEFORE_START_DATE
        message: The end date is before the start date

    ruleDuplicateTradeDescription:
      description: A duplicate trade description has been provided for the partnership. Trade descriptions must be unique (case-insensitive).
      value:
        code: RULE_DUPLICATE_TRADE_DESCRIPTION
        message: The trade description already exists for this partnership

    ruleMissingPartnershipTradesDetails:
      description: At least one of tradingOrProfessionalProfits or tradingOrProfessionalLosses must be provided.
      value:
        code: RULE_MISSING_PARTNERSHIP_TRADES_DETAILS
        message: At least one of tradingOrProfessionalProfits or tradingOrProfessionalLosses must be provided

    ruleIncorrectOrEmptyBody:
      description: An empty or non-matching body was submitted.
      value:
        code: RULE_INCORRECT_OR_EMPTY_BODY_SUBMITTED
        message: An empty or non-matching body was submitted

    ruleTaxYearNotSupported:
      description: |
        The specified tax year is not supported. The tax year specified is before the minimum tax year value.
      value:
        code: RULE_TAX_YEAR_NOT_SUPPORTED
        message: The tax year specified does not lie within the supported range

    ruleTaxYearRangeInvalid:
      description: Tax year range invalid. A tax year range of one year is required.
      value:
        code: RULE_TAX_YEAR_RANGE_INVALID
        message: A tax year range of one year is required

    ruleIncorrectGovTestScenario:
      description: The request did not match any available Sandbox data. Check that the supplied Gov-Test-Scenario is correct for this endpoint version. This error will only be returned in the Sandbox environment.
      value:
        code: RULE_INCORRECT_GOV_TEST_SCENARIO
        message: The supplied Gov-Test-Scenario is not valid

    ruleOutsideAmendmentWindow:
      description: The request cannot be completed as you are outside the amendment window.
      value:
        code: RULE_OUTSIDE_AMENDMENT_WINDOW
        message: You are outside the amendment window

    # 403

    clientOrAgentNotAuthorised:
      description: |
        The client or agent is not authorised. This is because: the client is not subscribed to MTD, 
        the agent is not subscribed to Agent Services, or the client has not authorised the agent to act on their behalf.
      value:
        code: CLIENT_OR_AGENT_NOT_AUTHORISED
        message: The client or agent is not authorised

    # 404

    notFound:
      description: The supplied income source could not be found.
      value:
        code: MATCHING_RESOURCE_NOT_FOUND
        message: Matching resource not found